<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Poni Rebuild</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="surface" id="surface">
    <button class="closed" id="closed" aria-expanded="false" aria-controls="open"><time class="clock">--:--</time></button>
    <div class="open" id="open" hidden>
      <header>
        <nav aria-label="Modules">
          <button class="tab active" data-page="home">⌂ <span>Home</span></button>
          <button class="tab" data-page="tasks">☑ <span>Todo</span></button>
          <button class="tab" data-page="notes">▣ <span>Notes</span></button>
          <button class="tab" data-page="calendar">▦ <span>Calendar</span></button>
          <button class="tab" data-page="timer">◷ <span>Timer</span></button>
          <button class="tab" data-page="weather">☀ <span>Weather</span></button>
          <button class="tab" data-page="worldclock">◉ <span>World clock</span></button>
          <button class="tab" data-page="dayprogress">◷ <span>Day progress</span></button>
          <button class="tab" data-page="system">▤ <span>System</span></button>
        </nav>
        <time class="clock">--:--</time>
        <button class="close" id="close" aria-label="Close panel">×</button>
      </header>
      <main>
        <section id="page-home" class="page home">
          <div class="media"><div class="album" aria-hidden="true">♫</div><div class="media-info"><strong id="media-title">Nothing playing</strong><p id="media-artist">Play something in a media player</p><div class="media-progress" aria-hidden="true"><div id="media-progress-fill"></div></div><div class="media-controls"><button type="button" data-media="previous" aria-label="Previous track">◀◀</button><button type="button" data-media="toggle" aria-label="Play or pause">▶</button><button type="button" data-media="next" aria-label="Next track">▶▶</button></div></div></div>
          <div class="calendar"><strong id="month"></strong><div id="week" class="week" aria-label="Next seven days"></div><p class="calendar-empty">No calendars yet.</p></div>
        </section>
        <section id="page-tasks" class="page" hidden>
          <form id="task-form"><div class="entry"><input id="task-input" aria-label="Task" maxlength="500" placeholder="Add a task" required><input id="task-due" type="datetime-local" aria-label="Due date"><button id="task-submit" type="submit">Add</button><button type="button" id="task-cancel" hidden>Cancel</button></div><textarea id="task-description" maxlength="10000" aria-label="Task description" placeholder="Details" hidden></textarea></form>
          <div class="items" id="tasks"></div>
        </section>
        <section id="page-notes" class="page" hidden>
          <form id="note-form" class="note-form"><textarea id="note-input" aria-label="Note" maxlength="100000" placeholder="Write a note" required></textarea><button type="submit">Save note</button><button type="button" id="note-cancel" hidden>Cancel</button></form>
          <div class="items" id="notes"></div>
        </section>
        <section id="page-calendar" class="page" hidden>
          <div class="calendar-layout"><div><div class="calendar-navigation"><button type="button" id="calendar-prev" aria-label="Previous month">‹</button><strong id="calendar-month"></strong><button type="button" id="calendar-next" aria-label="Next month">›</button></div><div id="calendar-grid" class="calendar-grid"></div></div>
          <div><strong id="calendar-selected"></strong><div id="calendar-items"></div><form id="calendar-form" class="calendar-form"><input id="event-title" placeholder="Event title" maxlength="200" aria-label="Event title" required><input id="event-start" type="datetime-local" aria-label="Event start" required><input id="event-duration" type="number" min="1" max="1440" value="30" aria-label="Duration in minutes" required><input id="event-location" placeholder="Location" maxlength="500" aria-label="Event location"><button type="submit" id="event-submit">Add event</button><button type="button" id="event-cancel" hidden>Cancel</button></form></div></div>
        </section>
        <section id="page-timer" class="page" hidden>
          <div class="timer-modes"><button type="button" class="timer-mode active" data-timer-mode="countdown">Timer</button><button type="button" class="timer-mode" data-timer-mode="stopwatch">Stopwatch</button></div>
          <div id="timer-countdown"><div class="timer-display" id="timer-display">25:00</div>
            <form id="timer-form" class="entry"><label for="timer-minutes">Minutes</label><input id="timer-minutes" type="number" min="1" max="1439" value="25" required><button id="timer-start" type="submit">Start</button><button type="button" id="timer-reset">Reset</button></form>
          </div>
          <div id="timer-stopwatch" hidden><div class="timer-display" id="stopwatch-display">00:00.0</div>
            <div class="stopwatch-controls"><button type="button" id="stopwatch-start">Start</button><button type="button" id="stopwatch-lap">Lap</button><button type="button" id="stopwatch-reset">Reset</button></div>
            <div id="stopwatch-laps"></div>
          </div>
        </section>
        <section id="page-weather" class="page" hidden>
          <form id="weather-search" class="entry"><input id="weather-city" aria-label="City" minlength="2" maxlength="100" placeholder="Find a city" required><button type="submit">Search</button></form>
          <div id="weather-results" class="weather-results"></div>
          <p id="weather-status" role="status" aria-live="polite"></p>
          <div id="weather-current"></div><div id="weather-days" class="weather-days"></div>
        </section>
        <section id="page-worldclock" class="page" hidden>
          <form id="worldclock-form" class="entry"><input id="worldclock-name" aria-label="Place name" placeholder="City" maxlength="30" required><input id="worldclock-zone" aria-label="Time zone" placeholder="Asia/Jakarta" list="worldclock-zones" required><datalist id="worldclock-zones"></datalist><button type="submit">Add</button></form>
          <div class="worldclock-plan"><label for="worldclock-minute">Time here</label><input type="range" min="0" max="1439" id="worldclock-minute"><button type="button" id="worldclock-now">Now</button></div>
          <div id="worldclock-list"></div>
        </section>
        <section id="page-system" class="page" hidden>
          <div class="system-grid"><div><span>CPU</span><strong id="system-cpu">—</strong><div class="system-meter"><div id="system-cpu-bar"></div></div></div><div><span>Memory</span><strong id="system-memory">—</strong><div class="system-meter"><div id="system-memory-bar"></div></div></div></div><p id="system-status" role="status" aria-live="polite"></p>
        </section>
        <section id="page-dayprogress" class="page" hidden>
          <div class="day-head"><strong id="day-percent">0%</strong><span id="day-remaining"></span></div>
          <div class="day-track"><div id="day-fill"></div></div>
          <div class="day-hours"><span>07:00</span><span>23:00</span></div>
          <div class="day-periods" id="day-periods"></div>
        </section>
      </main>
      <p id="status" role="status" aria-live="polite"></p>
    </div>
  </div>
</body>
</html>
