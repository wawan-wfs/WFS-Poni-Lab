<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Poni Rebuild</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="bookmarks.css">
  <script src="bookmarks.js" defer></script>
  <link rel="stylesheet" href="pomodoro.css">
  <script src="focus-synthesis.js" defer></script>
  <script src="focus-playback.js" defer></script>
  <script src="pomodoro.js" defer></script>
  <link rel="stylesheet" href="teleprompter.css">
  <script src="teleprompter.js" defer></script>
  <link rel="stylesheet" href="dashboard.css">
  <script src="dashboard.js" defer></script>
  <link rel="stylesheet" href="health.css">
  <script src="health.js" defer></script>
  <link rel="stylesheet" href="currency.css">
  <script src="currency.js" defer></script>
  <link rel="stylesheet" href="control.css">
  <script src="control.js" defer></script>
  <link rel="stylesheet" href="github.css">
  <script src="github.js" defer></script>
  <link rel="stylesheet" href="notifs.css">
  <script src="notifs.js" defer></script>
  <link rel="stylesheet" href="prayer.css">
  <script src="prayer.js" defer></script>
  <link rel="stylesheet" href="radio.css">
  <script src="radio.js" defer></script>
  <link rel="stylesheet" href="screentime.css">
  <script src="screentime.js" defer></script>
  <link rel="stylesheet" href="support.css">
  <script src="support.js" defer></script>
  <link rel="stylesheet" href="translate.css">
  <script src="translate.js" defer></script>
  <link rel="stylesheet" href="aiusage.css">
  <script src="aiusage.js" defer></script>
  <link rel="stylesheet" href="bluetooth.css">
  <script src="bluetooth.js" defer></script>
  <link rel="stylesheet" href="chat.css">
  <script src="chat.js" defer></script>
  <link rel="stylesheet" href="notes.css">
  <script src="notes.js" defer></script>
  <link rel="stylesheet" href="worldclock.css">
  <script src="worldclock.js" defer></script>
  <link rel="stylesheet" href="mirror.css">
  <script src="mirror.js" defer></script>
  <script src="ics-import.js" defer></script>
  <script src="night-warmth.js" defer></script>
  <script src="todo-language.js" defer></script>
  <script src="battery.js" defer></script>
  <link rel="stylesheet" href="shelf.css">
  <script src="clipboard-history.js" defer></script>
  <script src="drop-catalog.js" defer></script>
  <script src="shelf.js" defer></script>
  <script src="animations.js" defer></script>
  <script src="closed-display.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="surface" id="surface">
    <button class="closed" id="closed" aria-expanded="false" aria-controls="open">
      <span class="closed-slot" id="closed-slot-left" hidden><span class="closed-slot-value"></span><span class="battery-indicator" role="img" hidden><span class="battery-percent"></span><i class="battery-icon"></i></span></span>
      <span class="closed-clock"><span id="closed-day" hidden></span><time class="clock">--:--</time></span>
      <span id="battery-activity" role="status" hidden></span>
      <span id="closed-greeting" role="status" hidden><span id="greeting-symbol" aria-hidden="true"></span><span id="greeting-text"></span><small id="greeting-day"></small></span>
      <span id="notch-live" class="notch-live" hidden><img id="closed-media-artwork" alt="" hidden><span id="notch-live-title"></span><b id="notch-live-time"></b></span>
      <span id="closed-music-progress" aria-hidden="true" hidden></span>
      <span class="closed-slot" id="closed-slot-right" hidden><span class="closed-slot-value"></span><span class="battery-indicator" role="img" hidden><span class="battery-percent"></span><i class="battery-icon"></i></span></span>
    </button>
    <div id="closed-media-controls" class="closed-media-controls" role="group" aria-label="Media controls" hidden>
      <button type="button" data-media="previous" aria-label="Previous track">⏮</button>
      <button type="button" data-media="toggle" aria-label="Play or pause">▶</button>
      <button type="button" data-media="next" aria-label="Next track">⏭</button>
    </div>
    <div id="music-peek" class="todo-reminder music-peek" role="status" hidden><span></span></div>
    <div id="todo-reminder" class="todo-reminder" aria-label="Due task" hidden>
      <span id="todo-reminder-text" role="status"></span>
      <button type="button" id="todo-reminder-complete">Done</button>
      <button type="button" id="todo-reminder-snooze">Snooze</button>
    </div>
    <div id="bedtime-reminder" class="todo-reminder bedtime-reminder" aria-label="Bedtime reminder" hidden>
      <span id="bedtime-reminder-text" role="status">It’s bedtime</span>
      <button type="button" id="bedtime-dismiss">Done</button>
      <button type="button" id="bedtime-snooze">Snooze</button>
    </div>
    <div id="timer-reminder" class="todo-reminder timer-reminder" aria-label="Timer completion" hidden>
      <span id="timer-reminder-text" role="status"></span>
      <button type="button" id="timer-extend">+5 min</button>
      <button type="button" id="timer-dismiss">Done</button>
    </div>
    <div id="health-reminder" class="todo-reminder health-reminder" aria-label="Health reminder" hidden>
      <span id="health-reminder-text" role="status"></span>
      <button type="button" id="health-reminder-open">Open Health</button>
      <button type="button" id="health-log-water">Log glass</button>
    </div>
    <div id="video-shrink" class="todo-reminder video-shrink" hidden>
      <span id="video-shrink-status" role="status"></span>
      <progress id="video-shrink-progress" max="100" aria-label="Video compression progress"></progress>
      <button type="button" id="video-shrink-cancel">Cancel</button>
    </div>
    <div class="open" id="open" hidden>
      <header>
        <nav aria-label="Modules">
          <button class="tab active" data-page="home">⌂ <span>Home</span></button>
          <button class="tab" data-page="tasks">☑ <span>Todo</span></button>
          <button class="tab" data-page="notes">▣ <span>Notes</span></button>
          <button class="tab" data-page="calendar">▦ <span>Calendar</span></button>
          <button class="tab" data-page="timer">◷ <span>Timer</span></button>
          <button class="tab" data-page="weather">☀ <span>Weather</span></button>
          <button class="tab" data-page="worldclock">◉ <span>World clock</span></button>
          <button class="tab" data-page="dayprogress">◷ <span>Day progress</span></button>
          <button class="tab" data-page="system">▤ <span>System</span></button>
          <button class="tab" data-page="bookmarks" title="Bookmarks" aria-label="Bookmarks">☆ <span>Bookmarks</span></button>
          <button class="tab" data-page="pomodoro" title="Pomodoro" aria-label="Pomodoro">⌛ <span>Pomodoro</span></button>
          <button class="tab" data-page="teleprompter" title="Teleprompter" aria-label="Teleprompter">▱ <span>Teleprompter</span></button>
          <button class="tab" data-page="dashboard" title="Dashboard" aria-label="Dashboard">▦ <span>Dashboard</span></button>
          <button class="tab" data-page="health" title="Health" aria-label="Health">♡ <span>Health</span></button>
          <button class="tab" data-page="control" title="Control" aria-label="Control">⚙ <span>Control</span></button>
          <button class="tab" data-page="github" title="GitHub" aria-label="GitHub">◈ <span>GitHub</span></button>
          <button class="tab" data-page="notifs" title="Notifications" aria-label="Notifications">♢ <span>Notifications</span></button>
          <button class="tab" data-page="prayer" title="Prayer" aria-label="Prayer">☾ <span>Prayer</span></button>
          <button class="tab" data-page="radio" title="Radio" aria-label="Radio">♫ <span>Radio</span></button>
          <button class="tab" data-page="screentime" title="Screen Time" aria-label="Screen Time">◴ <span>Screen Time</span></button>
          <button class="tab" data-page="support" title="Support" aria-label="Support">♥ <span>Support</span></button>
          <button class="tab" data-page="translate" title="Translate" aria-label="Translate">文 <span>Translate</span></button>
          <button class="tab" data-page="aiusage" title="AI Usage" aria-label="AI Usage">◕ <span>AI Usage</span></button>
          <button class="tab" data-page="bluetooth" title="Bluetooth" aria-label="Bluetooth">ᛒ <span>Bluetooth</span></button>
          <button class="tab" data-page="chat" title="Chat" aria-label="Chat">◫ <span>Chat</span></button>
          <button class="tab" data-page="shelf" title="Shelf" aria-label="Shelf">▰ <span>Shelf</span><b id="shelf-count" hidden></b></button>
          <button class="tab" data-page="currency" title="Currency" aria-label="Currency">¤ <span>Currency</span></button>
        </nav>
        <button class="close" id="hide-notch" type="button" title="Hide Poni" aria-label="Hide Poni" hidden>◉</button>
        <span id="header-clock"><time class="clock">--:--</time><small id="header-date"></small></span>
        <span class="battery-indicator" role="img" hidden><span class="battery-percent"></span><i class="battery-icon"></i></span>
        <button class="settings-gear" type="button" id="settings-gear" title="Settings" aria-label="Settings">⚙</button>
        <button class="close" id="close" aria-label="Close panel">×</button>
      </header>
      <main>
        <div id="file-drop-actions" hidden></div>
        <section id="page-home" class="page home">
          <div class="media"><div class="album" aria-hidden="true"><span id="media-artwork-fallback">♫</span><img id="media-artwork" alt="" hidden></div><div class="media-info"><strong id="media-title">Nothing playing</strong><p id="media-artist">Play something in a media player</p><div class="media-progress" aria-hidden="true"><div id="media-progress-fill"></div></div><div class="media-controls"><button type="button" data-media="previous" aria-label="Previous track">◀◀</button><button type="button" data-media="toggle" aria-label="Play or pause">▶</button><button type="button" data-media="next" aria-label="Next track">▶▶</button></div></div></div>
          <div class="calendar" id="home-calendar"><strong id="month"></strong><div id="week" class="week" aria-label="Next seven days"></div><div id="home-events" class="calendar-empty"></div></div>
          <div id="mirror"></div>
        </section>
        <section id="page-tasks" class="page" hidden>
          <form id="task-form">
            <div class="entry"><input id="task-input" aria-label="Task" maxlength="500" placeholder="Add a task" required><input id="task-due" type="datetime-local" aria-label="Due date"><button id="task-submit" type="submit">Add</button><button type="button" id="task-cancel" hidden>Cancel</button></div>
            <div id="task-language-preview" class="task-language-preview" hidden>
              <span id="task-language-text" aria-live="polite"></span>
              <button type="button" id="task-language-ignore">Keep text as typed</button>
            </div>
            <textarea id="task-description" maxlength="10000" aria-label="Task description" placeholder="Details" hidden></textarea>
            <details id="task-repeat"><summary>Repeat</summary><div id="task-repeat-days"></div><label>Repeat time <input id="task-repeat-time" type="time"></label></details>
            <label class="task-late">Done if late
              <select id="task-late" aria-label="Done if late"><option value="">Follow Settings</option><option value="0">Never</option><option value="1">1 min</option><option value="3">3 min</option><option value="5">5 min</option><option value="10">10 min</option><option value="30">30 min</option><option value="60">1 hour</option></select>
            </label>
          </form>
          <div class="task-views" aria-label="Todo views">
            <button type="button" data-task-view="active" aria-pressed="true">Active</button>
            <button type="button" data-task-view="done" aria-pressed="false">Done</button>
            <button type="button" data-task-view="trash" aria-pressed="false">Trash</button>
            <button type="button" id="task-clear" hidden></button>
          </div>
          <div class="items" id="tasks"></div>
        </section>
        <section id="page-notes" class="page" hidden></section>
        <section id="page-calendar" class="page" hidden>
          <div class="calendar-layout"><div><div class="calendar-navigation"><button type="button" id="calendar-prev" aria-label="Previous month">‹</button><strong id="calendar-month"></strong><button type="button" id="calendar-next" aria-label="Next month">›</button></div><div id="calendar-grid" class="calendar-grid"></div><div id="calendar-hijri-range" class="hijri-date"></div></div>
          <div><strong id="calendar-selected"></strong><div id="calendar-hijri-day" class="hijri-date"></div><label class="hijri-setting">Hijri correction <select id="hijri-offset" aria-label="Hijri date correction"><option value="-2">−2 days</option><option value="-1">−1 day</option><option value="0">Umm al-Qura</option><option value="1">+1 day</option><option value="2">+2 days</option></select></label><div id="calendar-items"></div><form id="calendar-form" class="calendar-form"><input id="event-title" placeholder="Event title" maxlength="200" aria-label="Event title" required><input id="event-start" type="datetime-local" aria-label="Event start" required><input id="event-duration" type="number" min="1" max="1440" value="30" aria-label="Duration in minutes" required><select id="event-repeat" aria-label="Repeat event"><option value="none">Once</option><option value="daily">Daily</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option><option value="yearly">Yearly</option></select><input id="event-location" placeholder="Location" maxlength="500" aria-label="Event location"><button type="submit" id="event-submit">Add event</button><button type="button" id="event-cancel" hidden>Cancel</button></form></div></div>
          <div id="calendar-import"></div>
        </section>
        <section id="page-timer" class="page" hidden>
          <div class="timer-modes"><button type="button" class="timer-mode active" data-timer-mode="countdown">Timer</button><button type="button" class="timer-mode" data-timer-mode="stopwatch">Stopwatch</button></div>
          <div id="timer-countdown"><div class="timer-display" id="timer-display">25:00</div>
            <form id="timer-form" class="entry"><label for="timer-minutes">Minutes</label><input id="timer-minutes" type="number" min="1" max="1439" value="25" required><button id="timer-start" type="submit">Start</button><button type="button" id="timer-reset">Reset</button></form>
            <div id="timer-presets" class="timer-presets" aria-label="Timer presets"></div>
          </div>
          <div id="timer-stopwatch" hidden><div class="timer-display" id="stopwatch-display">00:00.0</div>
            <div class="stopwatch-controls"><button type="button" id="stopwatch-start">Start</button><button type="button" id="stopwatch-lap">Lap</button><button type="button" id="stopwatch-reset">Reset</button></div>
            <div id="stopwatch-laps"></div>
          </div>
        </section>
        <section id="page-weather" class="page" hidden>
          <form id="weather-search" class="entry"><input id="weather-city" aria-label="City" minlength="2" maxlength="100" placeholder="Find a city" required><button type="submit">Search</button></form>
          <div id="weather-results" class="weather-results"></div>
          <p id="weather-status" role="status" aria-live="polite"></p>
          <div id="weather-current"></div><div id="weather-days" class="weather-days"></div>
        </section>
        <section id="page-worldclock" class="page" hidden></section>
        <section id="page-system" class="page" hidden>
          <div class="system-grid"><div><span>CPU</span><strong id="system-cpu">—</strong><div class="system-meter"><div id="system-cpu-bar"></div></div></div><div><span>Memory</span><strong id="system-memory">—</strong><div class="system-meter"><div id="system-memory-bar"></div></div></div></div><p id="system-status" role="status" aria-live="polite"></p>
        </section>
        <section id="page-dayprogress" class="page" hidden>
          <div class="day-head"><strong id="day-percent">0%</strong><span id="day-remaining"></span></div>
          <div class="day-track"><div id="day-fill"></div><div id="day-markers" aria-hidden="true"></div></div>
          <div class="day-hours"><span id="day-wake-label">07:00</span><span id="day-bed-label">23:00</span></div>
          <div class="day-periods" id="day-periods"></div>
          <ul id="day-agenda" aria-label="Today's agenda"></ul>
          <form id="day-schedule" class="entry"><label for="day-wake">Wake</label><input type="time" id="day-wake" required><label for="day-bed">Bed</label><input type="time" id="day-bed" required><button type="submit">Save</button></form>
        </section>
        <section id="page-bookmarks" class="page" hidden></section>
        <section id="page-pomodoro" class="page" hidden></section>
        <section id="page-teleprompter" class="page" hidden></section>
        <section id="page-dashboard" class="page" hidden></section>
        <section id="page-health" class="page" hidden></section>
        <section id="page-currency" class="page" hidden></section>
        <section id="page-control" class="page" hidden></section>
        <section id="page-github" class="page" hidden></section>
        <section id="page-notifs" class="page" hidden></section>
        <section id="page-shelf" class="page" hidden></section>
        <section id="page-prayer" class="page" hidden></section>
        <section id="page-radio" class="page" hidden></section>
        <section id="page-screentime" class="page" hidden></section>
        <section id="page-support" class="page" hidden></section>
        <section id="page-translate" class="page" hidden></section>
        <section id="page-aiusage" class="page" hidden></section>
        <section id="page-bluetooth" class="page" hidden></section>
        <section id="page-chat" class="page" hidden></section>
      </main>
      <p id="status" role="status" aria-live="polite"></p>
    </div>
  </div>
</body>
</html>
