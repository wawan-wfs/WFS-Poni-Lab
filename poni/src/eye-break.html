<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Poni Eye Break</title>
  <link rel="stylesheet" href="eye-break.css">
  <script src="eye-break.js" defer></script>
</head>
<body>
  <main>
    <div class="eye" aria-hidden="true"></div>
    <h1>Eye break</h1>
    <p>Look at something about 6 metres (20 feet) away and let your eyes relax.</p>
    <output id="count" aria-label="Seconds remaining" aria-live="off"></output>
    <button id="skip" type="button" autofocus>Skip</button>
  </main>
</body>
</html>
