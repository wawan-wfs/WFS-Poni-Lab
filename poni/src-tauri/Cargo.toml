[package]
name = "poni-rebuild"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
dunce = "1"
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono-tz = "0.10"
chrono = { version = "0.4", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["bmp", "jpeg", "png", "tiff", "webp"] }
lopdf = { version = "0.47", default-features = false }
sysinfo = "=0.33.1"
zip = { version = "6", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4"
drag = "2.1"
rfd = { version = "0.18", default-features = false }
sha2 = "0.10"
windows-sys = { version = "0.61", features = ["Win32_Devices_Bluetooth", "Win32_Globalization", "Win32_Media_Audio", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Power", "Win32_System_Registry", "Win32_System_StationsAndDesktops", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_WindowsProgramming", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.61", features = ["ApplicationModel_DataTransfer", "Devices_Bluetooth", "Devices_Enumeration", "Foundation", "Graphics_Imaging", "Media_Control", "Media_MediaProperties", "Media_Ocr", "Media_Transcoding", "Security_Cryptography", "Storage", "Storage_Search", "Storage_Streams", "Win32_Foundation", "Win32_Media_Audio_Endpoints", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_WinRT", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
windows-collections = "0.2.0"
windows-future = { version = "0.2.1", features = ["std"] }
