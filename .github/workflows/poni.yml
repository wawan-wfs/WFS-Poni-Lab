name: Poni Rust build and tests
on:
  workflow_dispatch:
  push:
    branches: [poni/rebuild]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install 'playwright==1.56.0'
      - run: python -m playwright install --with-deps chromium
      - run: for file in poni/src/*.js; do node --check "$file" || exit 1; done
      - run: python poni/tests/browser_ui.py
      - run: python poni/tests/bookmarks.py
      - run: python poni/tests/pomodoro.py
      - run: python poni/tests/teleprompter.py
      - run: python poni/tests/health.py
      - run: python poni/tests/github_panel.py
      - run: python poni/tests/notifs.py
      - run: python poni/tests/bluetooth.py
      - run: python poni/tests/aiusage.py
      - run: python poni/tests/settings.py
      - run: python poni/tests/mirror.py
      - run: python poni/tests/ics_import.py
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        working-directory: poni/src-tauri
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: poni/src-tauri
      - run: cargo fmt --all -- --check
      - run: cargo test --all-targets
      - run: cargo build --release
      - name: Build Windows installer
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: poni
          uploadWorkflowArtifacts: true
      - name: Observe the native application
        shell: pwsh
        working-directory: .
        run: ./poni/ci/native-screenshot.ps1
      - name: Get the original Poni reference
        uses: actions/checkout@v4
        with:
          ref: main
          path: poni-reference
          sparse-checkout: reference
          persist-credentials: false
      - name: Observe the original Poni on the same desktop
        shell: pwsh
        working-directory: .
        run: ./poni/ci/reference-screenshot.ps1 -OpenSettings
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poni-rebuild-windows
          path: |
            poni/src-tauri/target/release/poni-rebuild.exe
            native-observation/
            reference-observation/
          retention-days: 7
          if-no-files-found: warn
