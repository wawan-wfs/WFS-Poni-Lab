name: Observe Poni on Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check reference executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $file = 'reference/poni.exe'
          $expected = '8f3f62d41e11210c5524fda430aa12171bbe6e56b578db7ff5dbfc299e71eb43'
          if (!(Test-Path -LiteralPath $file -PathType Leaf)) { throw 'Reference executable is missing.' }
          $actual = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Reference executable has an unexpected SHA-256: $actual" }
      - name: Observe launch and desktop
        shell: pwsh
        run: ./scripts/observe-poni.ps1
      - name: Upload observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poni-windows-observation
          path: observation/
          retention-days: 7
          if-no-files-found: warn
