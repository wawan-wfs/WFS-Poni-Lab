name: Poni Windows General recheck
on:
  push:
    branches: [poni/rebuild]
    paths:
      - .github/workflows/poni-native-recheck.yml
      - poni/ci/native-screenshot.ps1
permissions:
  contents: read
  actions: read
jobs:
  observe:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          run-id: 45331946611
          github-token: ${{ github.token }}
          name: poni-rebuild-windows
          path: recheck-input
      - name: Observe the rebuilt executable
        shell: pwsh
        run: |
          $destination = 'poni/src-tauri/target/release'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Copy-Item 'recheck-input/poni/src-tauri/target/release/poni-rebuild.exe' -Destination $destination
          ./poni/ci/native-screenshot.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: poni-general-native-recheck
          path: native-observation/
          retention-days: 7
